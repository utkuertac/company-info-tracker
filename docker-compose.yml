# Yerel geliştirme için SQL Server.
# Apple Silicon (M1/M2/M3) Mac'lerde Docker Desktop > Settings > General >
# "Use Rosetta for x86_64/amd64 emulation" seçeneği açık olmalıdır.
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    container_name: company-info-tracker-sql
    environment:
      ACCEPT_EULA: "Y"
      # Şifre git'e girmeyen .env dosyasından okunur (bkz. scripts/setup-env.sh)
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?.env dosyasinda MSSQL_SA_PASSWORD yok. Once ./scripts/setup-env.sh calistirin.}"
    ports:
      # Sadece bu bilgisayardan erişilebilir (aynı ağdaki diğer cihazlar bağlanamaz)
      - "127.0.0.1:1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql

volumes:
  sqlserver-data:
